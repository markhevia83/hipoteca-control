:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

<script>
(() => {

  let current = null, tab = 'datos';
  const euro = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+n || 0);
  const safe = s => String(s || '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const applicant = () => ({name:'',age:'',employment:'ajena',contract:'',tenure:'',income:'',pays:'14',activity:'',autonomoYears:'',monthlyProfit:'',annualProfit:'',bank:'',asnef:'Pendiente'});
  const fresh = () => ({id:crypto.randomUUID(),name:'',status:'Nuevo',adviceDate:HCReport.today(),modality:'Presencial',referredBy:'',phone:'',advisor:'',guarantor:'Pendiente',property:'',offers:[],clientNotes:'',applicants:[applicant(),applicant()],loans:[],savings:'',price:'',community:'',fixed:'3000',agency:'',finance:'',mortgageType:'fija',calculationProduct:'standard',termYears:'',rate:'3',variableRate:'3.5',mixedYears:'5',openingCommission:'0',financeCommission:false,insurance:'0',pensionPlan:'0',paymentProtection:'0',followups:[]});

  const termPolicy = c => { const ages=c.applicants.map(a=>+a.age).filter(a=>a>0), olderAge=ages.length?Math.max(...ages):0, ageLimit=olderAge?Math.max(0,75-olderAge):0, bankLimit=c.calculationProduct==='ing40'?40:30, applicableLimit=olderAge?Math.min(ageLimit,bankLimit):bankLimit, requestedTerm=+c.termYears||0, termAllowed=!!olderAge&&requestedTerm>=5&&requestedTerm<=applicableLimit; let termError=''; if(!requestedTerm) termError='Selecciona el plazo de la hipoteca.'; else if(!olderAge) termError='Introduce la edad de los titulares antes de calcular.'; else if(requestedTerm>bankLimit) termError=`El producto seleccionado admite un máximo de ${bankLimit} años.`; else if(requestedTerm>ageLimit) termError=`Por edad, el plazo máximo permitido es de ${ageLimit} años.`; else if(requestedTerm<5) termError='El plazo mínimo disponible es de 5 años.'; return {olderAge,ageLimit,bankLimit,applicableLimit,requestedTerm,termAllowed,termError}; };

  function dashboard(){ if(current&&!persist()){alert('No se ha podido guardar el expediente. Mantén esta página abierta y descarga el PDF.');return;} current=null; root.innerHTML=`<div class="hc-top"><div class="hc-brand">hipoteca.<small>Asesoramientos</small></div></div><div class="hc-shell"><div class="hc-head"><div><div class="hc-eyebrow">Tu cartera de clientes</div><h1>Todos los expedientes</h1><p><a class="hc-primary" href="./equipo.html">Entrar a mi cuenta · móvil y ordenador</a></p><p>Estos son los expedientes locales. Entra a tu cuenta y pulsa «Copiar expedientes de este navegador a mi cuenta» para sincronizarlos.</p><p role="status">${storageBlocked?'No se puede leer el registro local. No se sobrescribirán tus datos.':'Los expedientes se guardan en este navegador. No se sincronizan con otros dispositivos; borrar sus datos elimina este registro.'}</p></div><button class="hc-primary" data-new>Nuevo expediente</button></div><div class="hc-grid"><div class="hc-card hc-stat"><span>Expedientes activos</span><strong>${cases.filter(c=>c.status!=='Firmada').length}</strong></div><div class="hc-card hc-stat"><span>Gestiones registradas</span><strong>${cases.reduce((n,c)=>n+(c.followups||[]).length,0)}</strong></div><div class="hc-card hc-stat"><span>Hipotecas firmadas</span><strong>${cases.filter(c=>c.status==='Firmada').length}</strong></div></div><div class="hc-head"><h2>Asesoramientos</h2><button class="hc-subtle" data-new>+ Crear expediente</button></div><div class="hc-list">${cases.length?cases.map(c=>`<div class="hc-case"><div><strong>${safe(c.name||'Expediente sin nombre')}</strong><small>${safe(c.applicants.map(a=>a.name).filter(Boolean).join(' · ')||'Sin titulares indicados')}</small></div><span class="hc-badge">${safe(c.status)}</span><button class="hc-subtle" data-open="${c.id}">Abrir</button></div>`).join(''):'<div class="hc-empty">Aún no hay expedientes. Crea el primero para empezar.</div>'}</div></div>`; root.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>edit(fresh())); root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>edit(cases.find(c=>c.id===b.dataset.open))); }
  function edit(c){ lastSaved=''; current=structuredClone(c); current.followups ||= []; current.loans ||= []; current.rate ||= '3'; current.variableRate ||= '3.5'; current.mortgageType ||= 'fija'; current.mixedYears ||= '5'; current.openingCommission ||= '0'; current.insurance ||= '0'; current.pensionPlan ||= '0'; current.paymentProtection ||= '0'; while(current.applicants.length<2) current.applicants.push(applicant()); tab='datos'; render(); }
  function summaryView(){ const f=moneyFields(), room=f.available-f.mortgagePayment; return `<h2>Resumen económico</h2><dl><div><dt>Precio vivienda</dt><dd>${euro(current.price)}</dd></div><div><dt>ITP estimado</dt><dd>${current.community?euro(f.itp):'Pendiente'}</dd></div><div><dt>Total gastos</dt><dd>${euro(f.costs)}</dd></div><div><dt>Ahorros</dt><dd>${euro(current.savings)}</dd></div><div><dt>Hipoteca necesaria</dt><dd>${euro(f.mortgage)}</dd></div><div><dt>Financiación / precio</dt><dd>${current.price?f.pct.toFixed(1)+' %':'—'}</dd></div></dl><h3 style="margin:18px 0 4px">Capacidad de endeudamiento</h3><dl><div><dt>Ingresos netos / mes</dt><dd>${euro(f.incomeMonthly)}</dd></div><div><dt>Límite al 35 %</dt><dd>${euro(f.maxDebt)}</dd></div><div><dt>Cuotas de préstamos</dt><dd>${euro(f.loanMonthly)}</dd></div><div><dt>Margen para nueva hipoteca</dt><dd>${euro(f.available)}</dd></div><div><dt>Plazo máximo permitido</dt><dd>${f.olderAge?f.applicableLimit+' años':'Pendiente'}</dd></div><div><dt>Plazo elegido</dt><dd>${f.termYears?f.termYears+' años':'Pendiente'}</dd></div><div><dt>Nueva hipoteca estimada</dt><dd>${f.termYears?euro(f.mortgagePayment):'Pendiente'}</dd></div><div><dt>Resultado de la operación</dt><dd>${f.incomeMonthly&&f.termYears?(room>=0?'Dentro del margen':'Supera '+euro(Math.abs(room))):'Pendiente'}</dd></div><div><dt>Endeudamiento total</dt><dd>${f.incomeMonthly&&f.termYears?f.debtRatio.toFixed(1)+' %':'Pendiente'}</dd></div></dl>`; }
  function render(){ root.innerHTML=`<div class="hc-top"><div class="hc-brand">hipoteca.<small>Asesoramientos</small></div></div><div class="hc-shell"><div class="hc-head"><div><button class="hc-subtle" data-back>← Expedientes</button><div class="hc-eyebrow">Nuevo asesoramiento</div><h1>${safe(current.name||'Nuevo expediente')}</h1></div><div class="hc-pdf-actions"><button class="hc-primary" data-client-pdf>PDF completo</button><button class="hc-subtle" data-client-pdf="short">PDF resumido</button><button class="hc-subtle" data-save>Guardar expediente</button><p role="status" aria-live="polite" data-save-status></p></div></div><div class="hc-block"><div class="hc-fields"><div><label>Nombre del expediente *</label><input data-root="name" value="${safe(current.name)}" placeholder="Ej. Familia García"></div><div><label>Estado</label><select data-root="status">${option(['Nuevo','En estudio','Pendiente de documentación','Firmada','Descartada'],current.status)}</select></div></div></div><div class="hc-tabs" role="tablist" aria-label="Secciones del asesoramiento"><button class="${tab==='datos'?'hc-active':''}" data-tab="datos" role="tab" id="hc-tab-datos" aria-controls="hc-panel" aria-selected="${tab==='datos'}" tabindex="${tab==='datos'?'0':'-1'}">Cuestionario</button><button class="${tab==='calculo'?'hc-active':''}" data-tab="calculo" role="tab" id="hc-tab-calculo" aria-controls="hc-panel" aria-selected="${tab==='calculo'}" tabindex="${tab==='calculo'?'0':'-1'}">Operación de compra</button><button class="${tab==='seguimiento'?'hc-active':''}" data-tab="seguimiento" role="tab" id="hc-tab-seguimiento" aria-controls="hc-panel" aria-selected="${tab==='seguimiento'}" tabindex="${tab==='seguimiento'?'0':'-1'}">Seguimiento</button></div><div class="hc-layout"><div id="hc-panel" role="tabpanel" aria-labelledby="hc-tab-${tab}">${tab==='datos'?dataView():tab==='calculo'?calculatorView():followupView()}</div><aside class="hc-card hc-summary">${summaryView()}</aside></div></div>`; bind(); saveStatus(); }
  function applicantView(a,i){ const k=`data-ai="${i}"`; return `<section class="hc-block"><h2>Titular ${i+1}</h2><div class="hc-fields"><div><label>Nombre</label><input ${k} data-field="name" value="${safe(a.name)}"></div><div><label>Edad</label><input type="number" ${k} data-field="age" value="${safe(a.age)}"></div></div><div class="hc-mode"><label>Situación laboral</label><div class="hc-modes"><label><input type="radio" name="employment-${i}" ${k} data-field="employment" value="ajena" ${a.employment==='ajena'?'checked':''}> Trabajador por cuenta ajena</label><label><input type="radio" name="employment-${i}" ${k} data-field="employment" value="propia" ${a.employment==='propia'?'checked':''}> Trabajador por cuenta propia</label></div></div>${a.employment==='ajena'?`<div class="hc-fields"><div><label>Tipo de contrato</label><select ${k} data-field="contract">${option(['Pendiente','Indefinido','Temporal','Funcionario','Fijo discontinuo','Otro'],a.contract||'Pendiente')}</select></div><div><label>Antigüedad laboral</label><input ${k} data-field="tenure" value="${safe(a.tenure)}" placeholder="Ej. 3 años y 4 meses"></div><div><label>Ingresos netos por paga (€)</label><input type="number" ${k} data-field="income" value="${safe(a.income)}"></div><div><label>Número de pagas</label><input type="number" ${k} data-field="pays" value="${safe(a.pays)}"></div></div>`:`<div class="hc-fields"><div><label>Actividad profesional o empresa</label><input ${k} data-field="activity" value="${safe(a.activity)}"></div><div><label>Antigüedad como autónomo</label><input ${k} data-field="autonomoYears" value="${safe(a.autonomoYears)}" placeholder="Ej. 4 años"></div><div><label>Rendimiento neto mensual (€)</label><input type="number" ${k} data-field="monthlyProfit" value="${safe(a.monthlyProfit)}"></div><div><label>Beneficio neto anual declarado (€)</label><input type="number" ${k} data-field="annualProfit" value="${safe(a.annualProfit)}"></div></div>`}<div class="hc-fields" style="margin-top:12px"><div><label>Banco o bancos</label><input ${k} data-field="bank" value="${safe(a.bank)}"></div><div><label>¿Figura en ASNEF?</label><select ${k} data-field="asnef">${option(['Pendiente','Sí','No'],a.asnef)}</select></div></div></section>`; }
  function loansView(){ return `<section class="hc-block"><div class="hc-head"><div><h2>Préstamos actuales</h2><p>Añade una fila por cada préstamo; se suman todas las cuotas para calcular el margen disponible.</p></div><button class="hc-subtle" data-add-loan>+ Añadir préstamo</button></div>${current.loans.length?current.loans.map((l,i)=>`<div class="hc-card" style="margin-top:10px"><div class="hc-fields"><div><label>Titular</label><select data-loan="${i}" data-field="holder">${option(['Titular 1','Titular 2','Ambos'],l.holder||'Titular 1')}</select></div><div><label>Entidad</label><input data-loan="${i}" data-field="bank" value="${safe(l.bank)}" placeholder="Ej. Santander"></div><div><label>Concepto</label><input data-loan="${i}" data-field="concept" value="${safe(l.concept)}" placeholder="Ej. Coche"></div><div><label>Cuota mensual (€)</label><input type="number" data-loan="${i}" data-field="payment" value="${safe(l.payment)}"></div><div><label>Saldo pendiente (€)</label><input type="number" data-loan="${i}" data-field="balance" value="${safe(l.balance)}"></div><div><label>&nbsp;</label><button class="hc-danger" data-remove-loan="${i}">Quitar préstamo</button></div></div></div>`).join(''):'<div class="hc-empty">No hay préstamos registrados. Pulsa “Añadir préstamo” tantas veces como necesites.</div>'}</section>`; }
  function dataView(){ return `${HCReport.details(current)}${current.applicants.map(applicantView).join('')}${loansView()}<section class="hc-block"><h2>Ahorros y aval</h2><div class="hc-fields"><div><label>Ahorros conjuntos disponibles (€)</label><input type="number" data-root="savings" value="${safe(current.savings)}"></div><div><label>¿Existe posibilidad de aval?</label><select data-root="guarantor">${option(['Pendiente','Sí','No'],current.guarantor||'Pendiente')}</select></div></div></section>`; }
  function calculatorView(){ const f=moneyFields(), rows=amortization(); const table=rows.length?`<details><summary>Ver cuadro de amortización · ${rows.length} cuotas</summary><table class="hc-table"><thead><tr><th>Mes</th><th>Cuota</th><th>Intereses</th><th>Capital</th><th>Pendiente</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.n}</td><td>${euro(r.paid)}</td><td>${euro(r.interest)}</td><td>${euro(r.principal)}</td><td>${euro(r.balance)}</td></tr>`).join('')}</tbody></table></details>`:''; return `${HCReport.operation(current,rates)}<section class="hc-block"><div class="hc-eyebrow">Cálculo de la operación</div><h2>Operación de compra</h2><div class="hc-fields"><div><label>Precio de la vivienda (€) *</label><input type="number" min="0" data-root="price" value="${safe(current.price)}"></div><div><label>Aportación / ahorros (€)</label><input type="number" min="0" data-root="savings" value="${safe(current.savings)}"></div><div><label>Tipo de hipoteca</label><select data-root="mortgageType">${option(['fija','variable','mixta'],current.mortgageType)}</select></div><div><label>Banco / producto para el cálculo</label><select data-root="calculationProduct"><option value="standard" ${(current.calculationProduct||'standard')==='standard'?'selected':''}>Producto estándar · máximo 30 años</option><option value="ing40" ${current.calculationProduct==='ing40'?'selected':''}>ING · producto que admite hasta 40 años</option></select></div><div><label>Plazo de la hipoteca</label><select data-root="termYears">${termOptions(f)}</select><small class="hc-term-limit" data-term-limit>${f.olderAge?`Máximo permitido: ${f.applicableLimit} años. Se aplica 75 − edad del titular mayor, con un tope de ${f.bankLimit} años para este producto.`:'Introduce las edades para conocer el máximo. El plazo será 75 − edad del titular mayor, con un tope de '+f.bankLimit+' años para este producto.'}</small></div><div><label>Interés fijo / inicial (%)</label><input type="number" step="0.01" data-root="rate" value="${safe(current.rate)}"></div><div><label>Interés variable estimado (%)</label><input type="number" step="0.01" data-root="variableRate" value="${safe(current.variableRate)}"></div><div><label>Años a interés fijo en mixta</label><input type="number" data-root="mixedYears" value="${safe(current.mixedYears)}"></div><div><label>Comisión de apertura (%)</label><input type="number" step="0.01" data-root="openingCommission" value="${safe(current.openingCommission)}"></div><div><label><input type="checkbox" data-check="financeCommission" ${current.financeCommission?'checked':''}> Financiar la comisión de apertura</label></div><div><label>Seguros mensuales (€)</label><input type="number" data-root="insurance" value="${safe(current.insurance)}"></div><div><label>Plan de pensiones mensual (€)</label><input type="number" data-root="pensionPlan" value="${safe(current.pensionPlan)}"></div><div><label>Protección de pagos mensual (€)</label><input type="number" data-root="paymentProtection" value="${safe(current.paymentProtection)}"></div></div>${f.termError?`<div class="hc-note" role="alert" data-term-warning><strong>No se calcula con este plazo.</strong> ${safe(f.termError)}</div>`:''}<div class="hc-result-row"><div class="hc-result-box"><span>Resultado estimado</span><strong data-payment-summary>${f.termYears?'Hipoteca: '+euro(f.mortgage)+' · cuota inicial '+euro(f.mortgagePayment)+'/mes':'Selecciona un plazo permitido para calcular la cuota'}</strong></div><button class="hc-primary" data-calculate>Calcular financiación</button></div><div data-amortization>${table}</div><div class="hc-note">Los seguros, el plan de pensiones y la protección de pagos se suman a la cuota para el análisis de endeudamiento. El plazo se elige manualmente y siempre queda limitado por el producto y por la edad del titular de mayor edad.</div></section>${HCReport.comparisons(current)}`; }
  function followupView(){ return `<section class="hc-block"><div class="hc-head"><div><h2>Seguimiento</h2><p>Registra llamadas y próximos pasos.</p></div><button class="hc-subtle" data-followup>+ Añadir gestión</button></div>${current.followups.length?current.followups.map(f=>`<div class="hc-card"><strong>${safe(f.date)}</strong><p>${safe(f.note)}</p></div>`).join(''):'<div class="hc-empty">Aún no hay gestiones registradas.</div>'}</section>`; }
  // Update calculated output without replacing the inputs during blur/click.
  function updateComputed(){
    const side=root.querySelector('.hc-summary');
    if(side) side.innerHTML=summaryView();
    root.querySelector('h1').textContent=current.name||'Nuevo expediente';
    if(tab!=='calculo') return;
    const f=moneyFields();
    root.querySelector('[data-term-limit]').textContent=f.olderAge?`Máximo permitido: ${f.applicableLimit} años. Se aplica 75 − edad del titular mayor, con un tope de ${f.bankLimit} años para este producto.`:`Introduce las edades para conocer el máximo. El plazo será 75 − edad del titular mayor, con un tope de ${f.bankLimit} años para este producto.`;
    root.querySelector('[data-payment-summary]').textContent=f.termYears?'Hipoteca: '+euro(f.mortgage)+' · cuota inicial '+euro(f.mortgagePayment)+'/mes':'Selecciona un plazo permitido para calcular la cuota';
    const output=root.querySelector('[data-amortization]');
    const shouldExpand=root.querySelector('[data-calculate]')===document.activeElement;
    const expanded=output.querySelector('details')?.open;
    const template=document.createElement('template');
    template.innerHTML=calculatorView();
    output.innerHTML=template.content.querySelector('[data-amortization]').innerHTML;
    if(expanded && output.querySelector('details')) output.querySelector('details').open=true;
    if(shouldExpand && output.querySelector('details')){output.querySelector('details').open=true;output.scrollIntoView({behavior:'smooth',block:'start'});}
  }
  function bind(){ HCReport.bind(root,current,moneyFields,render); root.querySelector('[data-back]').onclick=dashboard; root.querySelectorAll('[data-tab]').forEach(b=>{const activate=key=>{tab=key;render();const selected=root.querySelector('[data-tab="'+key+'"]');selected.focus({preventScroll:true});root.querySelector('.hc-tabs').scrollIntoView({block:'start'});};b.onclick=()=>activate(b.dataset.tab);b.onkeydown=e=>{const keys=['datos','calculo','seguimiento'],i=keys.indexOf(b.dataset.tab);let next;if(e.key==='ArrowRight')next=keys[(i+1)%3];if(e.key==='ArrowLeft')next=keys[(i+2)%3];if(e.key==='Home')next=keys[0];if(e.key==='End')next=keys[2];if(next){e.preventDefault();activate(next);}};}); root.querySelectorAll('[data-root]').forEach(el=>{const sync=()=>{current[el.dataset.root]=el.value;updateComputed()};if(['calculationProduct','termYears'].includes(el.dataset.root)){el.onchange=()=>{current[el.dataset.root]=el.value;render()}}else{el.oninput=sync;el.onchange=sync}}); root.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{current[el.dataset.check]=el.checked;updateComputed()}); root.querySelector('[data-calculate]')?.addEventListener('click',()=>updateComputed()); root.querySelectorAll('[data-ai]').forEach(el=>{const set=()=>{const a=current.applicants[+el.dataset.ai];a[el.dataset.field]=el.value;if(el.dataset.field==='employment')render();else updateComputed()};el.onchange=set;el.oninput=el.type==='number'||el.type==='text'?set:null}); root.querySelector('[data-add-loan]')?.addEventListener('click',()=>{current.loans.push({holder:'Titular 1',bank:'',concept:'',payment:'',balance:''});render()}); root.querySelectorAll('[data-loan]').forEach(el=>{const set=()=>{current.loans[+el.dataset.loan][el.dataset.field]=el.value;updateComputed()};el.oninput=set;el.onchange=set}); root.querySelectorAll('[data-remove-loan]').forEach(b=>b.onclick=()=>{current.loans.splice(+b.dataset.removeLoan,1);render()}); root.querySelector('[data-save]').onclick=()=>{if(persist())alert('Expediente guardado en este navegador.');else alert('No se ha podido guardar. Mantén la página abierta y descarga el PDF.')}; root.querySelector('[data-followup]')?.addEventListener('click',()=>{const note=prompt('Describe la gestión:');if(note?.trim()){current.followups.unshift({date:new Date().toLocaleDateString('es-ES'),note});render()}}); }
  dashboard();
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerdown", handlePointer);
    document.removeEventListener("pointercancel", handlePointer);
    document.removeEventListener("click", handleTouchClick);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerdown", handlePointer);
  document.addEventListener("pointercancel", handlePointer);
  document.addEventListener("click", handleTouchClick);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
