async function prepareTeamCache(){
 if(!('serviceWorker' in navigator))return;
 const registration=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
 await registration.update();
 const deadline=Date.now()+15000;
 while(Date.now()<deadline){
   const safe=await new Promise(resolve=>{const channel=new MessageChannel();const timeout=setTimeout(()=>{channel.port1.close();resolve(false)},300);channel.port1.onmessage=e=>{clearTimeout(timeout);channel.port1.close();resolve(e.data===true)};navigator.serviceWorker.controller?.postMessage('hc-team-cache-safe',[channel.port2]);});
   if(safe)return;
   await new Promise(resolve=>setTimeout(resolve,150));
 }
 throw Error('La actualización del acceso aún no ha terminado. Cierra esta pestaña y vuelve a abrirla.');
}

  const applicant = () => ({name:'',age:'',employment:'ajena',contract:'',tenure:'',income:'',pays:'14',activity:'',autonomoYears:'',monthlyProfit:'',annualProfit:'',bank:'',asnef:'Pendiente'});

ick=saveTeam; root.querySelector('[data-followup]')?.addEventListener('click',()=>{const note=prompt('Describe la gestión:');if(note?.trim()){current.followups.unshift({date:new Date().toLocaleDateString('es-ES'),note});render()}}); }

  async function manageTeam(){
    current=null;message('');
    root.innerHTML=`<section class="hc-shell"><button class="hc-subtle" id="team-back">← Expedientes</button><h1>Equipo</h1><p>Cada empleado accede a sus expedientes. Como administrador puedes consultar los de todo el equipo.</p><form id="team-invite" class="hc-block"><h2>Habilitar un empleado</h2><label for="invite-name">Nombre</label><input id="invite-name" maxlength="100" required><label for="invite-email">Correo</label><input id="invite-email" type="email" maxlength="254" required><button class="hc-primary">Habilitar acceso</button></form><p>Comparte este enlace con el empleado después de habilitar su correo:</p><p><a href="./equipo.html">${safe(location.origin+location.pathname)}</a></p><div id="team-directory">Cargando equipo…</div></section>`;
    document.getElementById('team-back').onclick=loadCases;
    async function directory(){
      const invitations=check(await api.from('hc_team_invitations').select('*').order('created_at'));const el=document.getElementById('team-directory');
      if(!el)return;
      el.innerHTML=invitations.map(i=>`<div class="hc-card"><strong>${safe(i.display_name)}</strong><p>${safe(i.email)} · ${i.claimed_by?'Cuenta activada':'Pendiente del primer acceso'}</p>${!i.claimed_by?`<button class="hc-subtle" data-invite-link="${safe(i.email)}">Preparar enlace de activación</button><div data-link-output></div>`:''}</div>`).join('')||'<p>No hay empleados habilitados todavía.</p>';
      el.querySelectorAll('[data-invite-link]').forEach(b=>b.onclick=async()=>{
        b.disabled=true;try{
          const result=await api.functions.invoke('hc-team-invite',{body:{email:b.dataset.inviteLink}});
          if(result.error){let detail;try{detail=await result.error.context?.json();}catch{}throw new Error('CONFLICT:'+(detail?.error||'No se pudo preparar el enlace. Vuelve a entrar e inténtalo de nuevo.'));}
          const output=b.parentElement.querySelector('[data-link-output]');
          output.innerHTML='<p>Entrega este enlace solo a la persona indicada. Es de un solo uso y caduca; si caduca puedes preparar otro.</p><label>Enlace de activación<input readonly></label>';
          output.querySelector('input').value=result.data.link;
          output.querySelector('input').onclick=e=>e.target.select();
          message('Enlace preparado. No se ha enviado ningún correo.');
        }catch(e){message(readableError(e),true);}finally{b.disabled=false;}
      });
    }
    document.getElementById('team-invite').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{check(await api.rpc('hc_team_invite',{p_email:document.getElementById('invite-email').value.trim(),p_name:document.getElementById('invite-name').value.trim()}));message('Correo habilitado. Puedes compartir el enlace con el empleado.');e.target.reset();await directory();}catch(err){message(readableError(err),true);}finally{b.disabled=false;}};
    try{await directory();}catch(e){message(readableError(e),true);}
  }
  let recovering=location.hash.includes('type=recovery')||location.hash.includes('type=invite');
  function passwordForm(){current=null;root.innerHTML='<section class="hc-shell team-login"><h1>Nueva contraseña</h1><form id="new-password-form"><label for="new-password">Contraseña (al menos 12 caracteres)</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><button class="hc-primary">Guardar contraseña</button></form></section>';document.getElementById('new-password-form').onsubmit=async e=>{e.preventDefault();try{check(await api.auth.updateUser({password:document.getElementById('new-password').value}));recovering=false;await enter();message('Contraseña actualizada.');}catch(err){message(readableError(err),true);}};}
  api.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovering=true;setTimeout(passwordForm,0);}if(event==='SIGNED_OUT'){viewEpoch++;login();}});
  async function start(){try{const session=check(await api.auth.getSession()).session;if(recovering&&session)passwordForm();else if(session)await enter();else login();}catch(e){login();message(readableError(e),true);}}
  start();

})();

}catch(e){document.getElementById('team-message').textContent=e.message;}}
launchTeam();
</script></body></html>
